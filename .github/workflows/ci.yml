name: CI ParkingUV

on:
  push:
    branches: ["**"]      # En cualquier rama
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4

      - name: Instalar dependencias
        run: uv sync

      - name: Pruebas unitarias (TDD)
        run: uv run pytest tests/ -v --ignore=tests/performance

      - name: Pruebas BDD (Gherkin)
        run: uv run pytest tests/bdd/ -v

performance:
  runs-on: ubuntu-latest
  if: github.ref == 'refs/heads/main'
  needs: tests

  steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v4

    - name: Instalar dependencias
      run: uv sync

    - name: Iniciar servidor
      run: uv run python src/app.py &

    - name: Esperar servidor
      run: sleep 3

    - name: Ejecutar Locust
      run: |
        uv run locust \
          --headless \
          -u 50 \
          -r 10 \
          --run-time 30s \
          --host http://localhost:8000 \
          --csv=results

    - name: Verificar P95
      run: |
        python -c "
        import csv
        with open('results_stats.csv') as f:
            rows = list(csv.DictReader(f))
            agg = next(r for r in rows if r['Name'] == 'Aggregated')
            p95 = float(agg['95%'])
            assert p95 < 300, f'P95={p95}ms supera 300ms'
            print(f'P95 OK: {p95}ms')
        "